name: CodeQL

on:
  push:
    branches:
      - development
      - main
  pull_request:
    branches:
      - development
      - main
  schedule:
    - cron: '0 5 * * 1' # Every Monday at 9am Yerevan time (UTC+4)

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: none

      - uses: github/codeql-action/analyze@v4
